<!doctype html>
<meta charset="utf-8">
<title>A request to a specific SNI profile succeeds</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// The `www` subdomain selects the TLS 1.3-only profile on the sidecar.
promise_test(async () => {
  const url = "https://www.{{host}}:{{ports[tls][0]}}/tls/resources/echo.py";
  let response;
  try {
    response = await fetch(url);
  } catch (error) {
    throw new OptionalFeatureUnsupportedError(
        "the harness does not trust the WPT CA for TLS profile certificates");
  }

  assert_true(response.ok, "request to the www profile succeeds");
  assert_equals(response.headers.get("x-negotiated-version"), "TLSv1_3");

  const seen = await response.json();
  assert_equals(seen["x-forwarded-proto"], "https");
}, "the sidecar selects a TLS profile by SNI and forwards the https scheme");
</script>
